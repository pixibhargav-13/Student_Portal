# Copy to application-local.yaml (git-ignored) and fill in your local values.
DB_HOST: localhost
DB_PORT: 5432
DB_NAME: studentportal
DB_USER: postgres
DB_PASSWORD: change-me

JWT_SECRET_KEY: generate-with-openssl-rand-base64-32
# 1 day / 30 days in ms
ACCESS_TOKEN_EXPIRY: 86400000
REFRESH_TOKEN_EXPIRY: 2592000000

CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174

# Returns the OTP in the send-otp response so the frontend can log in without SMS
OTP_DEV_MODE: true

# First admin, created on startup only if no admin exists
BOOTSTRAP_ADMIN_EMAIL: admin@studentportal.local
BOOTSTRAP_ADMIN_PASSWORD: change-me
